# r1_attribution_v1 -- Twin-eng: GNN-eng with every message-passing layer skipped (the MP-OFF twin, trained separately).
# Grid point 1 of 6: lr 0.001, embedding = hidden = 64. 100-epoch cap, patience 60; seeds via run_experiment.py --seed 1|2|3.
# Generated by scripts_cosim/make_r1a_arm_configs.py -- edit the generator, not this file.
trainer: gnn
lineage: r1_attribution_v1
cache_dir: simulation_data/graphs_cache_r1_attribution_v1_psv5_inf
unset_env:
- TRAIN_INIT_CHECKPOINT
- NEAR_RTT_LABEL_OVERRIDE_JSON
env:
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: inf
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '1'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v5
  PARTIAL_STATE_LOAD_SECONDS: '1'
  PARTIAL_STATE_PEER_MASS: '1'
  NEAR_RTT_FULL_CONTEXT_CE_WEIGHT: '1.0'
  PARTIAL_STATE_EXCHANGE_SECONDS: '1'
  NEAR_RTT_SKIP_FINAL_TEST: '1'
  NEAR_RTT_SPLIT_ARTIFACT: experiments/r1_attribution_v1_split.json
  NEAR_RTT_MP_PEER_EDGES: '1'
  GNN_DISABLE_MESSAGE_PASSING: '1'
args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 100
  patience: 60
  min-epochs: 100
  learning-rate: 0.001
  embedding-dim: 64
  hidden-dim: 64
wandb:
  project: gnn-r1-attribution-v1
  run_name: r1-attribution-v1-twin-eng-g1
  tags:
  - r1-attribution-v1
  - partial-state-v5
  - twin-eng
  - grid1
