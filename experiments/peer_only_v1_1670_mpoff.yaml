# peer_only_v1 -- Phase B, mpoff on the 1,670-dataset corpus (graphs_cache_peer_only_v1_1670_psv3).
# docs/lineages/peer_only_v1.md. Identical to the 516-dataset mpoff recipe except the cache;
# the split artifact (test = the same 34 r2 datasets) is unchanged so B1 pairs like with like.
trainer: gnn
lineage: peer_only_v1
cache_dir: simulation_data/graphs_cache_peer_only_v1_1670_psv3
unset_env:
- TRAIN_INIT_CHECKPOINT
env:
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_SPLIT_ARTIFACT: experiments/peer_affinity_v1_t1b_split.json
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: '2.5'
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '1'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v3
  PARTIAL_STATE_PEER_MASS: '1'
  NEAR_RTT_MP_PEER_EDGES: '1'
  GNN_DISABLE_MESSAGE_PASSING: '1'
args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 300
  patience: 60
  min-epochs: 100
  learning-rate: 0.002
wandb:
  project: gnn-peer-affinity-v1
  run_name: peer-only-v1-1670-mpoff
  tags:
  - peer-only-v1
  - corpus1670
  - mpoff
  - lr2e3
  - patience60
