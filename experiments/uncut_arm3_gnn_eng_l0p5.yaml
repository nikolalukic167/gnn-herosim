# uncut_arm3 -- the expected move-regret lever of uncut_groups_s0_v1 (gnn_eng, lambda = 0.5): experiments/uncut_arm1b_gnn_eng.yaml unchanged (Arm 1b's recipe, corpus, split 613c8cbb, batched teacher-forced loss,
# 100 epochs, -final.pt as the served checkpoint) plus lambda x the expected move regret on the ILS-labelled train groups (src/policy/gnn/batched_tf.py regret_term; table
# scripts_cosim/uncut_move_regret_label.py, sidecar pickle, train groups only; the val mask-only file feeds the per-epoch unscored-mass diagnostic). The registered design is the
# 'REGISTERED-DESIGN' entry in docs/lineages/uncut_groups_s0_v1.md. CPU, 6 threads, 0 dataloader workers (the device that matches Arm 1b). Seeds 1 and 2 via run_experiment.py --seed.
trainer: gnn
lineage: uncut_groups_s0_v1
cache_dir: /share/nikola.lukic/uncut_arm1/cache_run/cache
unset_env:
- TRAIN_INIT_CHECKPOINT
- NEAR_RTT_LABEL_OVERRIDE_JSON
env:
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_TOP_K: '1'
  NEAR_RTT_BATCHED_TF: '1'
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: inf
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '0'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v5
  PARTIAL_STATE_LOAD_SECONDS: '1'
  PARTIAL_STATE_PEER_MASS: '1'
  NEAR_RTT_FULL_CONTEXT_CE_WEIGHT: '1.0'
  PARTIAL_STATE_EXCHANGE_SECONDS: '1'
  NEAR_RTT_SKIP_FINAL_TEST: '1'
  NEAR_RTT_SPLIT_ARTIFACT: experiments/uncut_arm1_split.json
  NEAR_RTT_MP_PEER_EDGES: '1'
  NEAR_RTT_MP_BIPARTITE_EDGE_CONV: '1'
  NEAR_RTT_MP_BIPARTITE_EDGE_ATTR_ZERO: '1'
  NEAR_RTT_REGRET_LAMBDA: '0.5'
  NEAR_RTT_MOVE_REGRET_PATH: /share/nikola.lukic/uncut_groups/lever/move_regret.pkl
  NEAR_RTT_UNSCORED_MASK_VAL_PATH: /share/nikola.lukic/uncut_groups/lever/unscored_mask_val.pkl
args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 100
  patience: 60
  min-epochs: 100
  learning-rate: 0.001
  embedding-dim: 128
  hidden-dim: 128
  torch-threads: 6
  num-dataloader-workers: 0
wandb:
  project: gnn-uncut-arm1
  run_name: uncut-arm3-gnn-eng-l0p5
  tags:
  - uncut-arm3
  - lever-regret
  - device-cpu
  - lambda-0p5
  - batched-tf
  - ils-r010
  - opening30
  - gnn-eng
