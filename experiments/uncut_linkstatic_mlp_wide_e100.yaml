# WIDE MLP with the static block (expert, 2026-10-23; SCIENTIST's gap): the same-input MLP of uncut_linkstatic_mlp widened to hidden 675 as experiments/uncut_comb_fl_mlp_wide_fslabel.yaml did for v6, so the wide-MLP contrast changes the block and nothing else. Parameter count vs the gnn is reported at launch.
# 100-EPOCH PARALLEL RUN (expert, 2026-10-23; SCIENTIST files A3): the same recipe as experiments/uncut_linkstatic_mlp.yaml with epochs / min-epochs / patience 100 and the run name suffixed -e100. Sealed: no live cell and no curve read beyond crash / NaN health until the selection is filed.
# live_link_features_v1, the static link block (user, 2026-10-23): the fair-share-label recipe of experiments/uncut_comb_fl_mlp_fslabel.yaml (from scratch, 100 epochs, lr 1e-3, seed 1) on the v8 cache (partial_state_v8 = v7 + S1-S3,
# link_features.static_edge_columns) over the recaptured, relabelled union corpus (S6 capture, S7 labels, the label override and the split filed before launch). The same-input MLP sees S1-S3 at the scorer only.
# Cache and label paths are the corpus builder's (cache_v8 from datalab/v7_recache.sbatch CONTRACT_SECOND=partial_state_v8; S7's label_override_union_flows.json); the launcher checks every sha256 and fails loud on a missing file.
trainer: gnn
lineage: uncut_groups_s0_v1
cache_dir: /share/nikola.lukic/uncut_groups/flowcap/link_corpus/cache_v8/cache
unset_env:
- TRAIN_INIT_CHECKPOINT
- NEAR_RTT_LABEL_OVERRIDE_JSON
env:
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_TOP_K: '1'
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: inf
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '0'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v8
  PARTIAL_STATE_LOAD_SECONDS: '1'
  PARTIAL_STATE_PEER_MASS: '1'
  NEAR_RTT_FULL_CONTEXT_CE_WEIGHT: '1.0'
  PARTIAL_STATE_EXCHANGE_SECONDS: '1'
  NEAR_RTT_SKIP_FINAL_TEST: '1'
  NEAR_RTT_SPLIT_ARTIFACT: experiments/uncut_link_split.json
  NEAR_RTT_LABEL_OVERRIDE_JSON: /share/nikola.lukic/uncut_groups/llf_corpus/label_override_union_flows.json
  NEAR_RTT_ARM: mlp_same
  NEAR_RTT_BATCHED_TF: '1'
args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 100
  patience: 100
  min-epochs: 100
  learning-rate: 0.001
  embedding-dim: 675
  hidden-dim: 675
  torch-threads: 6
  num-dataloader-workers: 0
wandb:
  project: gnn-uncut-arm1
  run_name: uncut-linkstatic-mlp-wide-e100
  tags:
  - uncut-comb
  - linkstatic
  - partial-state-v8
  - batched-tf
  - ils-r010
  - opening30
  - mlp-same
  - wide-mlp
