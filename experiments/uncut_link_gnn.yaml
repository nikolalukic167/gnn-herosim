# live_link_features_v1 (registered 2026-10-23): v7 gnn (treatment). The filed fair-share-label recipe (experiments/uncut_comb_fl_gnn_fslabel.yaml, 20 epochs) on the recaptured union corpus
# (S6's capture under option D with stored flows, 11,125 states, 40 topologies), the fixed fair-share replay labels (S7) and the partial_state_v7 cache; split by topology (scripts_cosim/v7_corpus.py).
# Seeds 1-3 via --seed. The same corpus, split, labels and cache for all four arms; sha256 of each asserted by scripts_cosim/datalab/uncut_link_train.sbatch.
trainer: gnn
lineage: live_link_features_v1
cache_dir: /share/nikola.lukic/uncut_groups/flowcap/link_corpus/cache_v7/cache
unset_env:
- TRAIN_INIT_CHECKPOINT
- NEAR_RTT_LABEL_OVERRIDE_JSON
env:
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_TOP_K: '1'
  NEAR_RTT_BATCHED_TF: '1'
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: inf
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '0'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v7
  PARTIAL_STATE_LOAD_SECONDS: '1'
  PARTIAL_STATE_PEER_MASS: '1'
  NEAR_RTT_FULL_CONTEXT_CE_WEIGHT: '1.0'
  PARTIAL_STATE_EXCHANGE_SECONDS: '1'
  NEAR_RTT_SKIP_FINAL_TEST: '1'
  NEAR_RTT_SPLIT_ARTIFACT: experiments/uncut_link_split.json
  NEAR_RTT_LABEL_OVERRIDE_JSON: /share/nikola.lukic/uncut_groups/llf_corpus/label_override_union_flows.json
  NEAR_RTT_MP_PEER_EDGES: '1'
  NEAR_RTT_MP_BIPARTITE_EDGE_CONV: '1'
  NEAR_RTT_MP_BIPARTITE_EDGE_ATTR_ZERO: '1'
args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 20
  patience: 20
  min-epochs: 20
  learning-rate: 0.001
  embedding-dim: 128
  hidden-dim: 128
  torch-threads: 6
  num-dataloader-workers: 0
wandb:
  project: gnn-uncut-arm1
  run_name: uncut-link-gnn-eng
  tags:
  - live-link-v7
  - partial-state-v7
  - fslabel-recipe
  - batched-tf
  - ils-r010
  - opening30
  - gnn-eng
