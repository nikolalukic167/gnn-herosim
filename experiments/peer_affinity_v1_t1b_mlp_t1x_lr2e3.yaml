# peer_affinity_v1 T1 -- mlp_t1x: pointwise + counts + committed-peer exchange + peer-mass lookahead, lr 0.002.
# Registration: docs/lineages/peer_affinity_v1.md, "Training registration T1". Seeds via --seed 1..8.
trainer: mlp
lineage: peer_affinity_v1
cache_dir: simulation_data/graphs_cache_peer_affinity_v1_t1b
env:
  PARTIAL_STATE_CONTRACT: partial_state_v2
  PARTIAL_STATE_PEER_MASS: "1"
path_args: [output, split-artifact]
args:
  output: models/tabular/peer-affinity-v1-t1b-mlp_t1x-lr2e3.pt
  split-artifact: experiments/peer_affinity_v1_t1b_split.json
  partial-state: null
  candidate-relative-queue: null
  epochs: 600
  patience: 40
  lr: 0.002
  random-state: 42
  wandb-project: gnn-peer-affinity-v1
  wandb-run-name: peer-affinity-v1-t1b-mlp-t1x-lr2e3
