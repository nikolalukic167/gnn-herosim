# uncut_groups_s0_v1 DAgger round (one round, own-state training), MP-OFF twin arm, seed 2. DRAFT, NOT REGISTERED: no job may use it before the registration is merged.
# Fine-tune from the filed twin checkpoint (fl3/md5_twin.json: uncut-comb-fl-twin-seed2-final.pt) on old + new labels, 40 epochs. Everything else is the twin's recipe
# (experiments/uncut_comb_fl_twin.yaml at 72aa0a46): partial_state_v6, batched teacher-forced CE, MP off (GNN_DISABLE_MESSAGE_PASSING), embedding = hidden = 128; lr 1e-4 (amendment A1).
# Open item: (1) cache_dir below does not exist yet: the old v6 cache plus the labelled own-state captures, built by prepare_graphs_cache over the combined view. Labels: the old states keep
# NEAR_RTT_LABEL_OVERRIDE_JSON (S7's relabel); the new states take a NEW relabel json (amendment A1), state ids disjoint; lr 1e-4 by amendment A1.
trainer: gnn
lineage: uncut_groups_s0_v1
cache_dir: /share/nikola.lukic/uncut_groups/dagger/cache_old_new/cache
unset_env:
- NEAR_RTT_LABEL_OVERRIDE_JSON
env:
  TRAIN_INIT_CHECKPOINT: models/uncut-comb-fl-twin-seed2-final.pt
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_TOP_K: '1'
  NEAR_RTT_BATCHED_TF: '1'
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: inf
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '0'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v6
  PARTIAL_STATE_LOAD_SECONDS: '1'
  PARTIAL_STATE_PEER_MASS: '1'
