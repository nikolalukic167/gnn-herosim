# uncut_arm1b -- Arm 1b of uncut_groups_s0_v1 (twin_eng): Arm 1's recipe and corpus (experiments/uncut_arm1_twin_eng.yaml) with the BATCHED teacher-forced loss
# (NEAR_RTT_BATCHED_TF=1, src/policy/gnn/batched_tf.py) in place of the per-task Python walk and its NEAR_RTT_SCORE_TASK_ROWS_ONLY shortcut. A separate arm, not a replacement.
# Same: lr 0.001, embedding = hidden = 128, ce_only + full-context CE 1.0, 100 epochs, patience 60, min-epochs 100, cache, split 613c8cbb, NEAR_RTT_TOP_K 1, VAL_EXACT_REGRET 0,
# -final.pt as the served checkpoint, the val decode. Different: the loss builds every teacher-forced state in one vectorised pass and scores them in one call (dropout is one
# mask over the distinct-state rows, float order differs; the full list is in docs/lineages/uncut_groups_s0_v1.md, "Arm 1b pre-registered"). Seeds 1 and 2 via run_experiment.py --seed.
# The device (CPU-amd or GPU) is chosen by the one-epoch timings filed in the node; a GPU run sets nothing here, the launcher pins CUBLAS_WORKSPACE_CONFIG.
trainer: gnn
lineage: uncut_groups_s0_v1
cache_dir: /share/nikola.lukic/uncut_arm1/cache_run/cache
unset_env:
- TRAIN_INIT_CHECKPOINT
- NEAR_RTT_LABEL_OVERRIDE_JSON
env:
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_TOP_K: '1'
  NEAR_RTT_BATCHED_TF: '1'
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: inf
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '0'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v5
  PARTIAL_STATE_LOAD_SECONDS: '1'
  PARTIAL_STATE_PEER_MASS: '1'
  NEAR_RTT_FULL_CONTEXT_CE_WEIGHT: '1.0'
  PARTIAL_STATE_EXCHANGE_SECONDS: '1'
  NEAR_RTT_SKIP_FINAL_TEST: '1'
  NEAR_RTT_SPLIT_ARTIFACT: experiments/uncut_arm1_split.json
  NEAR_RTT_MP_PEER_EDGES: '1'
  GNN_DISABLE_MESSAGE_PASSING: '1'
args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 100
  patience: 60
  min-epochs: 100
  learning-rate: 0.001
  embedding-dim: 128
  hidden-dim: 128
  torch-threads: 6
  num-dataloader-workers: 0
wandb:
  project: gnn-uncut-arm1
  run_name: uncut-arm1b-twin-eng
  tags:
  - uncut-arm1b
  - batched-tf
  - ils-r010
  - opening30
  - twin-eng
