# peer_affinity_v1 x800 p2 rung (denser peer graph, docs/lineages/peer_affinity_v1.md Stage 3) -- mlp_t1: pointwise + counts + committed-peer exchange (peer-mass zeroed), lr 0.001.
# Registration: docs/lineages/peer_affinity_v1.md, "Training registration T1b" verbatim. Seeds via --seed 1..16.
trainer: mlp
lineage: peer_affinity_v1
cache_dir: simulation_data/graphs_cache_peer_affinity_v1_x800_p2
env:
  PARTIAL_STATE_CONTRACT: partial_state_v2
  PARTIAL_STATE_PEER_MASS: "0"
path_args: [output, split-artifact]
args:
  output: models/tabular/peer-affinity-v1-x800p2-mlp_t1-lr1e3.pt
  split-artifact: experiments/peer_affinity_v1_x800_p2_split.json
  partial-state: null
  candidate-relative-queue: null
  epochs: 600
  patience: 40
  lr: 0.001
  random-state: 42
  wandb-project: gnn-peer-affinity-v1
  wandb-run-name: peer-affinity-v1-x800p2-mlp-t1-lr1e3
