# Arm A of the message-passing restoration (see LINEAGES.md: siv1_full_corpus).
#
# Baseline for comparison is near-rtt-v2-full-corpus-siv1-dim14-ce-only (0.88x Knative
# live, still losing to MLP at 0.78x). Identical corpus, loss and hyperparameters to that
# run -- the ONLY difference is the GIN residual, so any delta is attributable to it.
#
# Residual: x = x0 + mp_gate * gin(x0, edge_index). Message passing augments the per-node
# encoding instead of replacing it, so the scorer keeps an undiluted view of each
# platform's own dim7 queue depth / dim13 usage. mp_gate is learnable (init 1.0); its
# final value reads out how much the model actually leans on the graph.
#
# Message passing stays bipartite here. Arm B adds same-node edges.
trainer: gnn
lineage: siv1_full_corpus
description: >
  Full-corpus siv1 dim14 CE-only with a gated GIN residual, bipartite message passing
  only. Arm A of the residual vs residual+node-edges comparison.

cache_dir: simulation_data/graphs_cache_full_corpus_siv1_dim14

unset_env:
  - TRAIN_INIT_CHECKPOINT   # from scratch, never resume

env:
  NEAR_RTT_LOSS_VARIANT: near-rtt-v2-trash-exp
  NEAR_RTT_SIDECAR_NAME: valid_combos_near_rtt_v2_capped.pkl
  NEAR_RTT_MARGIN_MODE: exp
  NEAR_RTT_MARGIN_CAP: "8.0"
  NEAR_RTT_MARGIN_EXP_SCALE: "0.75"
  NEAR_RTT_MARGIN_EXP_CLIP: "4.0"
  NEAR_RTT_TRASH_DELTA: "5.0"
  NEAR_RTT_TRASH_WEIGHT: "1.0"
  NEAR_RTT_FAR_WEIGHT: "0.75"
  NEAR_RTT_UNMAPPED_PENALTY: "8.0"
  # --- the variable under test ---
  NEAR_RTT_MP_RESIDUAL: "1"
  NEAR_RTT_MP_NODE_EDGES: "0"

args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 100

wandb:
  project: gnn-full-corpus-siv1-aug2026
  run_name: near-rtt-v2-full-corpus-siv1-dim14-ce-only-mp-residual
  tags: [near-rtt, ce-only, dim14, full-corpus, scale-invariant-v1, from-scratch, mp-residual]
