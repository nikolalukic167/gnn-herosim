# SMOKE (2 epochs): pipeline and epoch-time check for raw_plan_v1; its checkpoints are never served.
# raw_plan_v1 -- the MP-OFF twin of rawgnn: the same raw plan columns reach the scorer on each (task, platform)
# edge, every message-passing layer is skipped, so a partner's placement is invisible unless it lands on one of the
# task's own candidates (docs/lineages/raw_plan_v1.md).
trainer: gnn
lineage: raw_plan_v1
cache_dir: simulation_data/graphs_cache_backlog_corpus_v1_psv4_inf
unset_env:
- TRAIN_INIT_CHECKPOINT
- NEAR_RTT_LABEL_OVERRIDE_JSON
env:
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_SPLIT_ARTIFACT: experiments/backlog_corpus_v1_split.json
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: inf
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '1'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v4
  PARTIAL_STATE_LOAD_SECONDS: '1'
  PARTIAL_STATE_PEER_MASS: '1'
  NEAR_RTT_FULL_CONTEXT_CE_WEIGHT: '1.0'
  PARTIAL_STATE_EXCHANGE_SECONDS: '1'
  NEAR_RTT_MP_PEER_EDGES: '1'
  NEAR_RTT_PLAN_RAW: '1'
  GNN_DISABLE_MESSAGE_PASSING: '1'
args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 2
  patience: 2
  min-epochs: 1
  learning-rate: 0.002
wandb:
  project: gnn-peer-affinity-v1
  run_name: raw-plan-v1-rawmlp-smoke
  tags:
  - raw-plan-v1
  - smoke
  - partial-state-v4
  - rawmlp
  - mp-off
  - lr2e3
