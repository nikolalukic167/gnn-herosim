# peer_affinity_v1 T1 -- mlp_t1: pointwise + counts + committed-peer exchange (peer-mass zeroed), lr 0.001.
# Registration: docs/lineages/peer_affinity_v1.md, "Training registration T1". Seeds via --seed 1..8.
trainer: mlp
lineage: peer_affinity_v1
cache_dir: simulation_data/graphs_cache_peer_affinity_v1_t1
env:
  PARTIAL_STATE_CONTRACT: partial_state_v2
  PARTIAL_STATE_PEER_MASS: "0"
path_args: [output, split-artifact]
args:
  output: models/tabular/peer-affinity-v1-t1-mlp_t1-lr1e3.pt
  split-artifact: experiments/peer_affinity_v1_t1_split.json
  partial-state: null
  candidate-relative-queue: null
  epochs: 600
  patience: 600
  lr: 0.001
  random-state: 42
  wandb-project: gnn-peer-affinity-v1
