# accel_replica_v1 -- GNN-eng-physMP: GNN-eng with the physics edge columns live inside message passing (edge_attr not zeroed).
# Grid point 3 of 6: lr 0.0005, embedding = hidden = 128. 100-epoch cap, patience 60; seeds via run_experiment.py --seed 1|2|3.
# VARIANT of accel_replica_v1_gnn_eng_physmp_g3 (hand-written, not generator output): the only change is NEAR_RTT_CE_GRAPH_WEIGHT=stakes.
# Each training graph's CE is multiplied by its dataset's stakes weight = mean RTT of the dataset's plans in the CAPPED sidecar minus the
# true optimum, clipped to (0.25, 8) and renormalised to mean 1. DISCLOSED PROXY: the sidecar is a capped, near-optimum-biased sample of
# the sweep, so the stakes UNDERESTIMATE the random-plan regret (accepted). Offline, orders the work only; a live check follows if it moves.
trainer: gnn
lineage: accel_replica_v1
cache_dir: simulation_data/graphs_cache_accel_replica_v1_psv5_inf
unset_env:
- TRAIN_INIT_CHECKPOINT
- NEAR_RTT_LABEL_OVERRIDE_JSON
env:
  NEAR_RTT_SAVE_FINAL: '1'
  NEAR_RTT_CE_GRAPH_WEIGHT: stakes
  NEAR_RTT_TASK_TYPE_ONEHOT: '1'
  NEAR_RTT_PARTIAL_STATE_EDGES: '1'
  NEAR_RTT_DAG_ALPHA_KEY: inf
  NEAR_RTT_TIED_MAX_PLANS: '0'
  NEAR_RTT_TRAIN_OBJECTIVE: ce_only
  NEAR_RTT_VAL_EXACT_REGRET: '1'
  NEAR_RTT_DECODE_REPLICA_REUSE: '1'
  NEAR_RTT_DECODE_RELAX: '1'
  PARTIAL_STATE_CONTRACT: partial_state_v5
  PARTIAL_STATE_LOAD_SECONDS: '1'
  PARTIAL_STATE_PEER_MASS: '1'
  NEAR_RTT_FULL_CONTEXT_CE_WEIGHT: '1.0'
  PARTIAL_STATE_EXCHANGE_SECONDS: '1'
  NEAR_RTT_SKIP_FINAL_TEST: '1'
  NEAR_RTT_SPLIT_ARTIFACT: experiments/accel_replica_v1_split.json
  NEAR_RTT_MP_PEER_EDGES: '1'
  NEAR_RTT_MP_BIPARTITE_EDGE_CONV: '1'
  NEAR_RTT_MP_BIPARTITE_EDGE_ATTR_ZERO: '0'
args:
  regret-loss-weight: 0
  ce-loss-weight: 1
  epochs: 100
  patience: 60
  min-epochs: 100
  learning-rate: 0.0005
  embedding-dim: 128
  hidden-dim: 128
wandb:
  project: gnn-accel-replica-v1
  run_name: accel-replica-v1-stakes-gnn-eng-physmp-g3
  tags:
  - accel-replica-v1
  - partial-state-v5
  - gnn-eng-physmp
  - grid3
  - ce-graph-weight-stakes
